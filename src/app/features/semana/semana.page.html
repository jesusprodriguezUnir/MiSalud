<div class="semana bleed">
  @for (f of filas(); track f.dia) {
    <button
      class="dia-fila"
      [class.hoy]="f.esHoy"
      [class.sel]="f.esSeleccionado"
      [attr.aria-current]="f.esSeleccionado ? 'true' : null"
      (click)="ir(f.i)"
    >
      <span class="top">
        <strong>{{ f.dia }}</strong>
        <span class="tag" [class.gris]="!f.esFuerza">{{ f.tituloEntreno }}</span>
      </span>
      <span class="p"><b>Comida</b> · {{ f.comida }}</span>
      <span class="p"><b>Cena</b> · {{ f.cena }}</span>
      <span
        class="progreso-mini"
        [attr.aria-label]="
          'Cumplimiento: ' + f.progreso.hechas + ' de ' + f.progreso.total + ' completados'
        "
      >
        <span class="barra"><i [style.width.%]="f.progreso.pct"></i></span>
        <span class="cifra">{{ f.progreso.hechas }}/{{ f.progreso.total }}</span>
      </span>
    </button>
  }
</div>

<div class="export-bar">
  <button class="btn ghost mini" (click)="exportarPdf()">Exportar plan en PDF</button>
  <button class="btn ghost mini" (click)="descargarIcsPlan()">Añadir plan al calendario</button>
</div>
