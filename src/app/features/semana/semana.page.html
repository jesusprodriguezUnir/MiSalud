<div class="semana bleed">
  @for (d of dieta(); track d.dia; let i = $index) {
    <button class="dia-fila" [class.hoy]="i === hoyI" (click)="ir(i)">
      <span class="top">
        <strong>{{ d.dia }}</strong>
        <span class="tag" [class.gris]="!esFuerza(i)">{{ tituloCorto(i) }}</span>
      </span>
      <span class="p"><b>Comida</b> · {{ resumenComida(d) }}</span>
      <span class="p"><b>Cena</b> · {{ resumenCena(d) }}</span>
    </button>
  }
</div>

<div class="export-bar">
  <button class="btn ghost mini" (click)="exportarPdf()">Exportar plan en PDF</button>
  <button class="btn ghost mini" (click)="descargarIcsPlan()">Añadir plan al calendario</button>
</div>
