@if (!conectividad.online()) {
  <div class="offline">Sin conexión · los cambios se guardarán al volver</div>
}

<header>
  <div class="wrap hbar">
    <button class="nav" (click)="nav.mover(-1)" aria-label="Día anterior">‹</button>
    <div class="hdate">
      <strong>{{ diaSemana() | titlecase }}</strong>
      <span>{{ nav.fecha() | fechaLarga }}{{ nav.esHoy() ? ' · hoy' : '' }}</span>
    </div>
    <button class="nav" (click)="nav.mover(1)" aria-label="Día siguiente">›</button>
    <button class="logout" (click)="logout()">Salir</button>
  </div>
</header>

<main class="wrap">
  <router-outlet />
</main>

<nav class="tabs">
  <a routerLink="/hoy" routerLinkActive="on">
    <svg viewBox="0 0 24 24"><path d="M3 12h4l3 8 4-16 3 8h4" /></svg>Hoy
  </a>
  <a routerLink="/semana" routerLinkActive="on">
    <svg viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="16" rx="2" />
      <path d="M3 10h18M8 3v4M16 3v4" />
    </svg>
    Semana
  </a>
  <a routerLink="/peso" routerLinkActive="on">
    <svg viewBox="0 0 24 24">
      <path d="M3 17l6-6 4 4 8-8" />
      <path d="M21 3v6h-6" />
    </svg>
    Peso
  </a>
  <a routerLink="/compra" routerLinkActive="on">
    <svg viewBox="0 0 24 24">
      <path d="M6 6h15l-1.5 9h-12z" />
      <circle cx="9" cy="20" r="1.4" />
      <circle cx="18" cy="20" r="1.4" />
      <path d="M6 6L5 3H2" />
    </svg>
    Compra
  </a>
</nav>
