@if (!conectividad.online()) {
  <div class="offline">Sin conexión · los cambios se guardarán al volver</div>
}

<header>
  <div class="wrap hbar">
    <span class="brand">MiSalud</span>

    <nav class="tabs-desktop">
      <a routerLink="/hoy" routerLinkActive="on">Hoy</a>
      <a routerLink="/semana" routerLinkActive="on">Semana</a>
      <a routerLink="/peso" routerLinkActive="on">Peso</a>
      <a routerLink="/compra" routerLinkActive="on">Compra</a>
    </nav>

    <div class="hbar-actions">
      <button class="nav" (click)="nav.mover(-1)" aria-label="Día anterior">‹</button>
      <div class="hdate">
        <strong>{{ diaSemana() | titlecase }}</strong>
        <span>{{ nav.fecha() | fechaLarga }}{{ nav.esHoy() ? ' · hoy' : '' }}</span>
      </div>
      <button class="nav" (click)="nav.mover(1)" aria-label="Día siguiente">›</button>
      <button class="theme-toggle" (click)="theme.toggle()" [attr.aria-label]="temaLabel()" [title]="temaLabel()">
        @if (theme.tema() === 'claro') {
          <svg viewBox="0 0 24 24"><path d="M21 12.6A9 9 0 1 1 11.4 3a7 7 0 0 0 9.6 9.6Z" /></svg>
        } @else {
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" /><path d="M12 2v3M12 19v3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M2 12h3M19 12h3M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" /></svg>
        }
      </button>
      <button class="logout" (click)="logout()">Salir</button>
    </div>
  </div>
</header>

<main class="wrap">
  <router-outlet />
</main>

<nav class="tabs">
  <a routerLink="/hoy" routerLinkActive="on">
    <svg viewBox="0 0 24 24"><path d="M3 12h4l3 8 4-16 3 8h4" /></svg>Hoy
  </a>
  <a routerLink="/semana" routerLinkActive="on">
    <svg viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="16" rx="2" />
      <path d="M3 10h18M8 3v4M16 3v4" />
    </svg>
    Semana
  </a>
  <a routerLink="/peso" routerLinkActive="on">
    <svg viewBox="0 0 24 24">
      <path d="M3 17l6-6 4 4 8-8" />
      <path d="M21 3v6h-6" />
    </svg>
    Peso
  </a>
  <a routerLink="/compra" routerLinkActive="on">
    <svg viewBox="0 0 24 24">
      <path d="M6 6h15l-1.5 9h-12z" />
      <circle cx="9" cy="20" r="1.4" />
      <circle cx="18" cy="20" r="1.4" />
      <path d="M6 6L5 3H2" />
    </svg>
    Compra
  </a>
</nav>
