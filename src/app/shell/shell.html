@if (!conectividad.online()) {
  <div class="offline">Sin conexión · los cambios se guardarán al volver</div>
}

<header>
  <div class="wrap hbar">
    <span class="brand">MiSalud</span>

    <nav class="tabs-desktop" aria-label="Secciones">
      <a routerLink="/hoy" routerLinkActive="on" ariaCurrentWhenActive="page">Hoy</a>
      <a routerLink="/semana" routerLinkActive="on" ariaCurrentWhenActive="page">Semana</a>
      <a routerLink="/peso" routerLinkActive="on" ariaCurrentWhenActive="page">Peso</a>
      <a routerLink="/compra" routerLinkActive="on" ariaCurrentWhenActive="page">Compra</a>
    </nav>

    <div class="hbar-actions">
      <button class="nav" (click)="nav.mover(-1)" aria-label="Día anterior">‹</button>
      <div class="hdate">
        <strong>{{ diaSemana() | titlecase }}</strong>
        <span>{{ nav.fecha() | fechaLarga }}{{ nav.esHoy() ? ' · hoy' : '' }}</span>
      </div>
      <button class="nav" (click)="nav.mover(1)" aria-label="Día siguiente">›</button>
      <button
        class="theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-label]="temaLabel()"
        [title]="temaLabel()"
      >
        @if (theme.tema() === 'claro') {
          <svg viewBox="0 0 24 24"><path d="M21 12.6A9 9 0 1 1 11.4 3a7 7 0 0 0 9.6 9.6Z" /></svg>
        } @else {
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4.5" />
            <path
              d="M12 2v3M12 19v3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M2 12h3M19 12h3M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"
            />
          </svg>
        }
      </button>
      <a
        class="theme-toggle"
        routerLink="/ajustes"
        routerLinkActive="on"
        ariaCurrentWhenActive="page"
        aria-label="Ajustes"
        title="Ajustes"
      >
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"
          />
        </svg>
      </a>
      <button class="logout" (click)="logout()">Salir</button>
    </div>
  </div>
</header>

<main class="wrap">
  @if (listo()) {
    <router-outlet />
  } @else {
    <div class="esqueleto" aria-hidden="true">
      <div class="card">
        <div class="linea t"></div>
        <div class="linea"></div>
        <div class="linea corta"></div>
      </div>
      <div class="card">
        <div class="linea t"></div>
        <div class="linea"></div>
        <div class="linea corta"></div>
      </div>
    </div>
    <p class="cargando-sr">Cargando tu plan…</p>
  }
</main>

<app-aviso-toast />

<nav class="tabs" aria-label="Secciones">
  <a routerLink="/hoy" routerLinkActive="on" ariaCurrentWhenActive="page">
    <svg viewBox="0 0 24 24"><path d="M3 12h4l3 8 4-16 3 8h4" /></svg>Hoy
  </a>
  <a routerLink="/semana" routerLinkActive="on" ariaCurrentWhenActive="page">
    <svg viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="16" rx="2" />
      <path d="M3 10h18M8 3v4M16 3v4" />
    </svg>
    Semana
  </a>
  <a routerLink="/peso" routerLinkActive="on" ariaCurrentWhenActive="page">
    <svg viewBox="0 0 24 24">
      <path d="M3 17l6-6 4 4 8-8" />
      <path d="M21 3v6h-6" />
    </svg>
    Peso
  </a>
  <a routerLink="/compra" routerLinkActive="on" ariaCurrentWhenActive="page">
    <svg viewBox="0 0 24 24">
      <path d="M6 6h15l-1.5 9h-12z" />
      <circle cx="9" cy="20" r="1.4" />
      <circle cx="18" cy="20" r="1.4" />
      <path d="M6 6L5 3H2" />
    </svg>
    Compra
  </a>
</nav>
